name: Build test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/cloud-credentials-keystore-fallback

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run cloud credentials tests
        run: npx jest __tests__/CloudCredentialsFallback.test.ts --coverage --collectCoverageFrom=src/utils/secureStorage.ts

      - name: Create gradle.properties
        run: cp android/gradle.properties.template android/gradle.properties

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: freekiosk-keystore-fallback-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
